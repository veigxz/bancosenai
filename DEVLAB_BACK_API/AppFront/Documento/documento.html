<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Documentos - Banco Senai</title>
    <link rel="stylesheet" href="../Documento/documento.css">
</head>
<body>
    <h1>Gestão de Documentos</h1>

    <div class="form-container">
        <input type="number" id="codigoCliente" placeholder="Código do Cliente">
        <input type="file" id="arquivo">
        <button id="btEnviar" onclick="enviarDocumento()">Enviar</button>
    </div>

    <div class="form-container">
        <input type="number" id="codigoClienteBusca" placeholder="Código do Cliente">
        <button id="btBuscar" onclick="listarArquivos()">Buscar</button>
    </div>
    

    <table id="tabelaArquivos">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Extensão</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpoTabela">
           
        </tbody>
    </table>

    

    <script src="../Documento/documento.js"></script>
</body>
</html>
